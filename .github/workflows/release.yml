name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-plugin-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Verify tag matches core/version
        run: |
          version=$(cat core/version)
          ref="${GITHUB_REF_NAME}"
          if [ "${ref#v}" != "${version}" ]; then
            echo "Tag ${ref} does not match core/version ${version}"
            exit 1
          fi
      - run: uv run pytest
      - name: Build Python package
        run: uv build --out-dir release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
